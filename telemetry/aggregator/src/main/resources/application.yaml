eureka:
  client:
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/
    healthcheck:
      enabled: true
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
    prefer-ip-address: true

spring:
  application:
    name: aggregator

  config:
    import: 'configserver:http://localhost:8888'

  cloud:
    config:
      discovery:
        enabled: true
        serviceId: config-server
      fail-fast: true
      retry:
        initial-interval: 1000    # начальная задержка между попытками — 1 с
        multiplier: 1.1           # коэффициент увеличения интервала
        max-attempts: 6          # максимальное число попыток — 6
        max-interval: 6000        # максимальный интервал между попытками — 6 с